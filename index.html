        // ==================== HELPER FUNCTIONS ====================
        function formatDate(date) {
            const d = new Date(date);
            return `${d.getDate().toString().padStart(2,'0')}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getFullYear()}`;
        }

        function formatMonthYear(date) {
            const d = new Date(date);
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            return `${months[d.getMonth()]} - ${d.getFullYear()}`;
        }

        function getMonthOptions() {
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            const currentYear = new Date().getFullYear();
            const options = [];
            for (let i = 0; i < 12; i++) {
                options.push(`${months[i]} - ${currentYear}`);
                options.push(`${months[i]} - ${currentYear - 1}`);
            }
            return [...new Set(options)].sort().reverse();
        }

        function formatCurrency(amount) {
            return `৳${amount.toLocaleString()}`;
        }

        function parseDate(dateStr) {
            if (!dateStr) return new Date();
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return new Date(parts[2], parts[1]-1, parts[0]);
            }
            return new Date(dateStr);
        }

        function isOverdue(dueDateStr) {
            if (!dueDateStr) return false;
            const due = parseDate(dueDateStr);
            const today = new Date();
            today.setHours(0,0,0,0);
            return today > due;
        }

        function saveToLocal() {

                users: appData.users,

                settings: appData.settings,
                lastBackupTime: new Date().toISOString()
            };
            localStorage.setItem("smcable_data", JSON.stringify(saveData));
            appData.lastBackupTime = new Date();
        }

        // ==================== WHATSAPP FUNCTIONS ====================
        function sendWhatsApp(phoneNumber, message) {
            let cleanPhone = phoneNumber.toString().replace(/[^0-9]/g, '');

            window.open(`https://wa.me/${cleanPhone}?text=${encodedMsg}`, '_blank');

        function sendBillCreationWhatsApp(user, bill) {
            const message = `🏢 *SM-Cable Network* 🏢\n\n📢 *NEW BILL GENERATED* 📢\n\nDear *${user.name}*,\n\nYour bill for *${bill.month}* has been generated.\n\n━━━━━━━━━━━━━━━━\n💰 Package Amount: ${formatCurrency(user.monthlyBill)}\n📋 Previous Due: ${formatCurrency(bill.previousDue || 0)}\n💰 *Total Bill: ${formatCurrency(bill.amount)}*\n📅 Due Date: ${bill.dueDate}\n━━━━━━━━━━━━━━━━\n\n🔗 *Pay Now:* ${user.paymentLink}\n\nPlease clear your dues before the due date to avoid late fees.\n\nThank you!\n📞 Support: ${appData.settings.phone[0]}`;
            sendWhatsApp(user.phone, message);
        }

        // ==================== BILLING ENGINE ====================
        // Get total due from ALL previous months (not just last month)
        function getTotalPreviousDue(userId, currentMonthYear) {
            const allBills = appData.bills.filter(b => b.userId === userId && b.month !== currentMonthYear);
            return allBills.reduce((sum, b) => sum + b.due, 0);
        }

        // Get latest bill for a user
        function getLatestBill(userId) {
            const userBills = appData.bills.filter(b => b.userId === userId);
            if (userBills.length === 0) return null;
            return userBills.sort((a, b) => b.month.localeCompare(a.month))[0];
        }

        function generateMonthlyBill(userId, monthYear) {
            const user = appData.users.find(u => u.userId === userId);
            if (!user || user.status !== "active") return null;
            
            // Check if bill already exists for this month
            const existingBill = appData.bills.find(b => b.userId === userId && b.month === monthYear);
            if (existingBill) return existingBill;
            
            // Calculate previous due from ALL previous months
            const previousDue = getTotalPreviousDue(userId, monthYear);
            
            // Calculate total bill = package price + previous due
            let totalBill = user.monthlyBill + previousDue;
            let lateFee = 0;
            
            // Check if latest bill is overdue for late fee
            const latestBill = getLatestBill(userId);
            if (latestBill && latestBill.dueDate && isOverdue(latestBill.dueDate) && latestBill.due > 0) {
                lateFee = appData.admin.lateFee;
                totalBill += lateFee;
            }
            
            const dueDate = new Date();
            dueDate.setDate(dueDate.getDate() + appData.admin.dueDays);
            
            const newBill = {
                billId: `BILL-${Date.now()}-${userId}`,
                userId: userId,
                month: monthYear,
                generatedDate: formatDate(new Date()),
                amount: totalBill,
                paid: 0,
                due: totalBill,
                previousDue: previousDue,
                packageAmount: user.monthlyBill,
                lateFee: lateFee,
                dueDate: formatDate(dueDate),
                status: "unpaid",
                paymentHistory: []
            };
            appData.bills.push(newBill);
            saveToLocal();
            
            // Send WhatsApp notification for new bill
            sendBillCreationWhatsApp(user, newBill);
            
            return newBill;
        }

        function recordPayment(userId, monthYear, amount, method = "cash") {
            // Find the specific bill for that month
            let bill = appData.bills.find(b => b.userId === userId && b.month === monthYear);
            
            if (!bill) {
                // If no bill exists for that month, create one first
                bill = generateMonthlyBill(userId, monthYear);
                if (!bill) return { success: false, message: "Cannot create bill for this user" };
            }
            
            const paymentAmount = Math.min(amount, bill.due);
            bill.paid += paymentAmount;
            bill.due -= paymentAmount;
            bill.status = bill.due === 0 ? "paid" : "partial";
            
            if (bill.paymentHistory) {
                bill.paymentHistory.push({
                    date: formatDate(new Date()),
                    amount: paymentAmount,
                    method: method
                });
            } else {
                bill.paymentHistory = [{
                    date: formatDate(new Date()),
                    amount: paymentAmount,
                    method: method
                }];
            }
            
            // Also update all subsequent bills' previous due calculations
            // Get all future bills and recalculate their due
            const userBills = appData.bills.filter(b => b.userId === userId).sort((a, b) => a.month.localeCompare(b.month));
            let runningDue = 0;
            for (let i = 0; i < userBills.length; i++) {
                const currentBill = userBills[i];
                if (currentBill.month === monthYear) {
                    runningDue = currentBill.due;
                } else {
                    // Recalculate this bill based on running due
                    const oldAmount = currentBill.amount;
                    currentBill.previousDue = runningDue;
                    currentBill.amount = currentBill.packageAmount + runningDue + (currentBill.lateFee || 0);
                    const amountDiff = currentBill.amount - oldAmount;
                    currentBill.due += amountDiff;
                    runningDue = currentBill.due;
                }
            }
            
            appData.transactions.push({
                id: `TXN-${Date.now()}`,
                userId: userId,
                userName: appData.users.find(u => u.userId === userId)?.name,
                date: formatDate(new Date()),
                monthYear: monthYear,
                amount: paymentAmount,
                type: "payment",
                method: method,
                receivedBy: "admin"
            });
            saveToLocal();
            return { success: true, amount: paymentAmount, remaining: bill.due };
        }

        function updateUserPackage(userId, packageId, packageName, monthlyBill) {
            const user = appData.users.find(u => u.userId === userId);
            if (user) {
                user.packageId = packageId;
                user.packageName = packageName;
                user.monthlyBill = monthlyBill;
                saveToLocal();
                return true;
            }
            return false;
        }

        function getMonthlyOverview(monthYear) {
            const overview = [];
            appData.users.forEach(user => {
                const bill = appData.bills.find(b => b.userId === user.userId && b.month === monthYear);
                const totalDue = getTotalPreviousDue(user.userId, monthYear);
                overview.push({
                    userId: user.userId,
                    name: user.name,
                    phone: user.phone,
                    monthlyBill: user.monthlyBill,
                    previousDue: bill ? bill.previousDue : totalDue,
                    currentBill: bill ? bill.amount : 0,
                    paid: bill ? bill.paid : 0,
                    due: bill ? bill.due : totalDue,
                    status: bill ? bill.status : "No Bill",
                    connectionType: user.connectionType
                });
            });
            return overview;
        }

        // ==================== PACKAGE MANAGEMENT ====================
        function addPackage(type, name, price) {
            const id = `${type}_${Date.now()}`;
            appData.packages[type].push({ id, name, price });
            saveToLocal();
        }

        function deletePackage(type, id) {
            appData.packages[type] = appData.packages[type].filter(p => p.id !== id);
            saveToLocal();
        }

        function editPackage(type, id, name, price) {
            const pkg = appData.packages[type].find(p => p.id === id);
            if (pkg) {
                pkg.name = name;
                pkg.price = price;
                saveToLocal();
            }
        }

            if (darkMode) document.body.classList.add("dark");
            else document.body.classList.remove("dark");
            
            const isLoggedIn = sessionStorage.getItem("loggedIn");
            if (!isLoggedIn) {
                renderLogin();
                return;
            }
            const userType = sessionStorage.getItem("userType");
            if (userType === "admin") {
                renderAdminDashboard();
            } else {
                const userId = sessionStorage.getItem("userId");
                const user = appData.users.find(u => u.userId === userId);
                if (user) renderCustomerPortal(user);
                else renderLogin();
            }
        }

            const container = document.getElementById("mainContent");
            if (!container) return;

            else if (currentView === "users") renderUsersPage(container);
            else if (currentView === "packages") renderPackagesPage(container);
            else if (currentView === "billing") renderBillingPage(container);
            else if (currentView === "monthlyOverview") renderMonthlyOverview(container);
            else if (currentView === "transactions") renderTransactionsPage(container);
            else if (currentView === "settings") renderSettingsPage(container);
        }

        function renderDashboard(container) {
            const totalUsers = appData.users.length;
            const activeUsers = appData.users.filter(u => u.status === "active").length;
            const totalDue = appData.bills.reduce((sum, b) => sum + b.due, 0);
            const monthlyCollection = appData.transactions.filter(t => t.monthYear === formatMonthYear(new Date())).reduce((sum, t) => sum + t.amount, 0);
            
            container.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                    <div class="bg-white rounded-xl p-4 shadow-sm card-hover">
                        <div class="flex items-center justify-between">

            const pin = document.getElementById("adminPin").value;
            if (pin === appData.admin.pin) {
                sessionStorage.setItem("loggedIn", "true");
                sessionStorage.setItem("userType", "admin");
                renderApp();
            } else { Swal.fire("Error", "Invalid PIN!", "error"); }
        };
        
        window.customerLogin = () => {
            const phone = document.getElementById("customerPhone").value;
            const password = document.getElementById("customerPassword").value;
            const user = appData.users.find(u => u.phone === phone && u.password === password);
            if (user) {
                sessionStorage.setItem("loggedIn", "true");
                sessionStorage.setItem("userType", "customer");
                sessionStorage.setItem("userId", user.userId);
                renderApp();
            } else { Swal.fire("Error", "Invalid credentials!", "error"); }
        };
        
        window.logout = () => { sessionStorage.clear(); renderApp(); };
        
        window.showAddUserModal = () => {
            Swal.fire({
                title: 'Add New User',
                html: `
                    <input id="userId" class="swal2-input" placeholder="User ID" required>
                    <input id="name" class="swal2-input" placeholder="Full Name" required>
                    <input id="phone" class="swal2-input" placeholder="Phone Number" required>
                    <input id="password" class="swal2-input" placeholder="Password" type="password" required>
                    <select id="packageSelect" class="swal2-select">
                        <option value="">Select Package</option>
                        ${[...appData.packages.internet, ...appData.packages.cable, ...appData.packages.combo].map(p => `<option value="${p.id}|${p.name}|${p.price}">${p.name} - ${formatCurrency(p.price)}</option>`).join('')}
                    </select>
                    <input id="expiredDate" class="swal2-input" placeholder="Expiry Date (DD-MM-YYYY)" required>
                `,
                preConfirm: () => {
                    const userId = document.getElementById('userId').value;
                    if (appData.users.find(u => u.userId === userId)) {
                        Swal.showValidationMessage('User ID exists!');
                        return false;
                    }
                    const packageData = document.getElementById('packageSelect').value.split('|');
                    return {
                        userId: userId,
                        name: document.getElementById('name').value,
                        phone: document.getElementById('phone').value,
                        password: document.getElementById('password').value,
                        packageId: packageData[0],
                        packageName: packageData[1],
                        monthlyBill: parseFloat(packageData[2]),
                        connectionType: packageData[1].includes('Combo') ? 'Both' : (packageData[1].includes('Mbps') ? 'Internet' : 'Cable'),
                        address: "N/A",
                        expiredDate: document.getElementById('expiredDate').value,
                        paymentLink: `https://pay.smcable.net/${userId}`,
                        status: "active",
                        createdAt: formatDate(new Date())
                    };
                }
            }).then(result => {
                if (result.isConfirmed) {
                    appData.users.push(result.value);
                    saveToLocal();
                    Swal.fire('Success', 'User added!', 'success');
                    renderCurrentView();
                }
            });
        };
        
        window.editUser = (userId) => {
            const user = appData.users.find(u => u.userId === userId);
            if (!user) return;
            Swal.fire({
                title: 'Edit User',
                html: `
                    <input id="editName" class="swal2-input" value="${user.name}" placeholder="Name">
                    <input id="editPhone" class="swal2-input" value="${user.phone}" placeholder="Phone">
                    <select id="editPackage" class="swal2-select">
                        ${[...appData.packages.internet, ...appData.packages.cable, ...appData.packages.combo].map(p => `<option value="${p.id}|${p.name}|${p.price}" ${user.packageId === p.id ? 'selected' : ''}>${p.name} - ${formatCurrency(p.price)}</option>`).join('')}
                    </select>
                    <input id="editExpiry" class="swal2-input" value="${user.expiredDate}" placeholder="Expiry Date">
                    <select id="editStatus" class="swal2-select">
                        <option value="active" ${user.status === 'active' ? 'selected' : ''}>Active</option>
                        <option value="expired" ${user.status === 'expired' ? 'selected' : ''}>Expired</option>
                    </select>
                `,
                preConfirm: () => {
                    const packageData = document.getElementById('editPackage').value.split('|');
                    return {
                        name: document.getElementById('editName').value,
                        phone: document.getElementById('editPhone').value,
                        packageId: packageData[0],
                        packageName: packageData[1],
                        monthlyBill: parseFloat(packageData[2]),
                        expiredDate: document.getElementById('editExpiry').value,
                        status: document.getElementById('editStatus').value
                    };
                }
            }).then(result => {
                if (result.isConfirmed) {
                    Object.assign(user, result.value);
                    saveToLocal();
                    Swal.fire('Updated!', '', 'success');
                    renderCurrentView();
                }
            });
        };
        
        window.deleteUser = (userId) => {
            Swal.fire({ title: 'Confirm', text: 'Delete user?', icon: 'warning', showCancelButton: true }).then(result => {
                if (result.isConfirmed) {
                    appData.users = appData.users.filter(u => u.userId !== userId);
                    appData.bills = appData.bills.filter(b => b.userId !== userId);
                    saveToLocal();
                    Swal.fire('Deleted', '', 'success');
                    renderCurrentView();
                }
            });
        };
        
        window.createNewBill = () => {
            const userId = document.getElementById('billUser')?.value;
            const month = document.getElementById('billMonth')?.value;
            if (!userId || !month) { Swal.fire('Error', 'Select user and month', 'error'); return; }
            const bill = generateMonthlyBill(userId, month);
            if (bill) { 
                Swal.fire('Success', 'Bill generated & WhatsApp notification sent!', 'success'); 
                renderCurrentView();
            } else { 
                Swal.fire('Error', 'Cannot generate bill', 'error'); 
            }
        };
        
        window.recordPaymentFromAdmin = () => {
            const userId = document.getElementById('paymentUser')?.value;
            const month = document.getElementById('paymentMonth')?.value;
            const amount = parseFloat(document.getElementById('paymentAmount')?.value);
            const method = document.getElementById('paymentMethod')?.value;
            if (!userId || !month || !amount) { Swal.fire('Error', 'Fill all fields', 'error'); return; }
            const result = recordPayment(userId, month, amount, method);
            if (result.success) { 
                Swal.fire('Success', `Payment of ${formatCurrency(result.amount)} recorded! Remaining due: ${formatCurrency(result.remaining)}`, 'success'); 
                renderCurrentView();
            } else { 
                Swal.fire('Error', result.message, 'error'); 
            }
        };
        
        window.sendBillInvoice = (userId, month) => {
            const user = appData.users.find(u => u.userId === userId);
            const bill = appData.bills.find(b => b.userId === userId && b.month === month);
            if (user && bill) sendInvoiceWhatsApp(user, bill);
        };
        
        window.sendSupportWhatsAppFromCustomer = (phone) => sendSupportWhatsApp(phone);
        
        window.showAddPackageModal = (type) => {
            Swal.fire({
                title: `Add ${type} Package`,
                html: `<input id="pkgName" class="swal2-input" placeholder="Package Name"><input id="pkgPrice" class="swal2-input" placeholder="Price" type="number">`,
                preConfirm: () => {
                    const name = document.getElementById('pkgName').value;
                    const price = parseFloat(document.getElementById('pkgPrice').value);
                    if (!name || !price) { Swal.showValidationMessage('Fill all fields'); return false; }
                    return { name, price };
                }
            }).then(result => {
                if (result.isConfirmed) {
                    addPackage(type, result.value.name, result.value.price);
                    renderCurrentView();
                }
            });
        };
        
        window.showEditPackageModal = (type, id, name, price) => {
            Swal.fire({
                title: 'Edit Package',
                html: `<input id="pkgName" class="swal2-input" value="${name}"><input id="pkgPrice" class="swal2-input" value="${price}" type="number">`,
                preConfirm: () => {
                    const newName = document.getElementById('pkgName').value;
                    const newPrice = parseFloat(document.getElementById('pkgPrice').value);
                    return { name: newName, price: newPrice };
                }
            }).then(result => {
                if (result.isConfirmed) {
                    editPackage(type, id, result.value.name, result.value.price);
                    renderCurrentView();
                }
            });
        };
        
        window.deletePackageItem = (type, id) => {
            Swal.fire({ title: 'Confirm', text: 'Delete package?', icon: 'warning', showCancelButton: true }).then(result => {
                if (result.isConfirmed) { deletePackage(type, id); renderCurrentView(); }
            });
        };
        
        window.saveSettings = () => {
            appData.admin.lateFee = parseFloat(document.getElementById('lateFee')?.value) || 50;
            appData.admin.dueDays = parseInt(document.getElementById('dueDays')?.value) || 30;
            const newPin = document.getElementById('newPin')?.value;
            if (newPin && newPin.length >= 4) appData.admin.pin = newPin;
            saveToLocal();
            Swal.fire('Saved', 'Settings updated!', 'success');
        };
        
        window.backupData = () => {
            const data = { users: appData.users, packages: appData.packages, bills: appData.bills, transactions: appData.transactions, admin: appData.admin, settings: appData.settings, lastBackupTime: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `smcable_backup_${formatDate(new Date())}.json`;
            link.click();
            appData.lastBackupTime = new Date();
            saveToLocal();
        };
        
        window.restoreData = (input) => {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.users) appData.users = data.users;
                    if (data.packages) appData.packages = data.packages;
                    if (data.bills) appData.bills = data.bills;
                    if (data.transactions) appData.transactions = data.transactions;
                    if (data.admin) appData.admin = data.admin;
                    if (data.settings) appData.settings = data.settings;
                    appData.lastBackupTime = new Date();
                    saveToLocal();
                    Swal.fire('Restored', 'Data restored successfully!', 'success').then(() => location.reload());
                } catch (err) { Swal.fire('Error', 'Invalid backup file', 'error'); }
            };
            reader.readAsText(file);
        };
        
        window.resetAllData = () => {
            Swal.fire({ title: 'Confirm Reset', text: 'This will delete ALL data!', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33' }).then(result => {
                if (result.isConfirmed) {
                    localStorage.removeItem("smcable_data");
                    location.reload();
                }
            });
        };
        
        // Initialize
        loadFromLocal();
        renderApp();
    </script>
</body>
</html>
